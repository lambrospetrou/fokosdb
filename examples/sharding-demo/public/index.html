<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FokosShardingRuntime — Demo Suite</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.orange.min.css" />
		<style>
			:root {
				--font-family: system-ui, -apple-system, sans-serif;
			}
			body {
				padding: 1.5rem;
				max-width: 1400px;
				margin: 0 auto;
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
			}
			#app,
			.app-shell {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}
			header.demo-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				border-bottom: 1px solid var(--pico-muted-border-color);
				padding-bottom: 1rem;
				margin-bottom: 1.5rem;
			}
			.tile-nav {
				display: flex;
				gap: 0.5rem;
			}
			.tile-nav button {
				padding: 0.4rem 0.9rem;
				font-size: 0.85rem;
				margin: 0;
			}
			.tile-nav button.active {
				background: var(--pico-primary);
				color: var(--pico-primary-inverse);
			}
			.layout-grid {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 380px;
				gap: 1.5rem;
				align-items: stretch;
				flex: 1;
				min-height: 0;
			}
			@media (max-width: 1024px) {
				.layout-grid {
					grid-template-columns: 1fr;
					flex: none;
				}
				.topology-scroll {
					max-height: 70vh;
				}
			}
			.topology-container {
				background: var(--pico-card-background-color);
				border: 1px solid var(--pico-muted-border-color);
				border-radius: var(--pico-border-radius);
				padding: 1rem;
				position: relative;
				min-height: 320px;
				display: flex;
				flex-direction: column;
			}
			.topology-scroll {
				flex: 1;
				min-height: 0;
				overflow: auto;
			}
			.topology-toolbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 0.75rem;
				font-size: 0.8rem;
				color: var(--pico-muted-color);
			}
			.topology-svg {
				display: block;
			}
			/* Box styles */
			.node-group {
				cursor: pointer;
				transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			}
			.node-rect {
				fill: #1e293b;
				stroke: #475569;
				stroke-width: 2;
				rx: 8;
				ry: 8;
				transition: all 0.3s ease;
			}
			.node-group:hover .node-rect {
				stroke: var(--pico-primary);
				filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.3));
			}
			.node-group.is-router .node-rect {
				fill: #111827;
				stroke: #ea580c;
				stroke-dasharray: 4 2;
			}
			.node-group.is-active-target .node-rect {
				stroke: #22c55e;
				filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.5));
			}
			.node-title {
				font-size: 13px;
				font-weight: 700;
				fill: #f8fafc;
			}
			.node-badge {
				font-size: 10px;
				font-weight: 600;
				fill: #ea580c;
				text-transform: uppercase;
			}
			.node-subtitle {
				font-size: 11px;
				fill: #94a3b8;
			}
			/* Connection links */
			.tree-link {
				fill: none;
				stroke: #334155;
				stroke-width: 2;
				transition: stroke 0.3s ease;
			}
			.tree-link.link-active {
				stroke: var(--pico-primary);
				stroke-width: 3.5;
				filter: drop-shadow(0 0 6px var(--pico-primary));
			}
			.link-pulse-dot {
				fill: #f97316;
				filter: drop-shadow(0 0 6px #f97316);
			}
			/* Controls and sidebar */
			.control-card {
				background: var(--pico-card-background-color);
				border: 1px solid var(--pico-muted-border-color);
				border-radius: var(--pico-border-radius);
				padding: 1.25rem;
			}
			.control-card h3 {
				font-size: 1.1rem;
				margin-bottom: 0.5rem;
			}
			.control-card p {
				font-size: 0.85rem;
				color: var(--pico-muted-color);
				margin-bottom: 1rem;
			}
			.btn-row {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				margin-bottom: 1rem;
			}
			.btn-row button {
				width: 100%;
				margin: 0;
				padding: 0.5rem 0.8rem;
				font-size: 0.85rem;
			}
			.stats-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 0.5rem;
				margin-bottom: 1rem;
			}
			.stat-item {
				background: #0f172a;
				border: 1px solid #1e293b;
				border-radius: 6px;
				padding: 0.5rem 0.75rem;
			}
			.stat-item small {
				color: #94a3b8;
				font-size: 0.7rem;
				display: block;
			}
			.stat-item strong {
				font-size: 1.1rem;
				color: #f8fafc;
			}
			.log-console {
				background: #020617;
				border: 1px solid #1e293b;
				border-radius: 6px;
				padding: 0.6rem;
				font-family: monospace;
				font-size: 0.75rem;
				max-height: 180px;
				overflow-y: auto;
				color: #cbd5e1;
			}
			.log-entry {
				padding: 0.2rem 0;
				border-bottom: 1px solid #0f172a;
			}
			.log-entry:last-child {
				border-bottom: none;
			}
			.log-time {
				color: #64748b;
				margin-right: 0.4rem;
			}
			.log-trace {
				color: #f97316;
			}
			/* Demo 2 search: the partitions that the search visited, and the tenant partitions that it skipped */
			.node-group.is-visited .node-rect {
				stroke: #22c55e;
				stroke-width: 3;
			}
			.node-group.is-skipped {
				opacity: 0.35;
			}
			/* The search bar and its results span both columns, above the topology and the control panel. */
			.search-card {
				margin-bottom: 1rem;
				background: var(--pico-card-background-color);
				border: 1px solid var(--pico-muted-border-color);
				border-radius: var(--pico-border-radius);
				padding: 0.75rem 1rem;
			}
			.search-form {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				margin: 0;
			}
			.search-form select,
			.search-form input[type="search"],
			.search-form button {
				margin: 0;
				padding: 0.4rem 0.6rem;
				font-size: 0.85rem;
				height: auto;
			}
			.search-row {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.5rem 0.75rem;
			}
			.search-row select {
				width: 6.5rem;
				flex: none;
			}
			/* Pico draws a search icon at the left edge, so the text starts after it. */
			.search-row input[type="search"] {
				flex: 1 1 16rem;
				min-width: 12rem;
				padding-inline-start: 2.25rem;
				background-position: center left 0.7rem;
			}
			.search-row .chip-row {
				flex-wrap: nowrap;
			}
			/* Pico gives a submit button the full width. This rule keeps the button at the right end of the row. */
			.search-row button[type="submit"] {
				width: auto;
				flex: none;
				margin-left: auto;
			}
			.search-row-label {
				font-size: 0.75rem;
				color: var(--pico-muted-color);
			}
			.chip-row {
				display: flex;
				flex-wrap: wrap;
				gap: 0.3rem;
			}
			.search-form .chip-row button {
				padding: 0.15rem 0.5rem;
				font-size: 0.72rem;
				font-family: monospace;
				width: auto;
			}
			.search-form label {
				font-size: 0.8rem;
				margin: 0;
				white-space: nowrap;
			}
			.search-summary {
				margin-top: 0.75rem;
				font-size: 0.8rem;
				color: #22c55e;
				margin-bottom: 0.4rem;
			}
			.hit-list {
				max-height: 220px;
				overflow-y: auto;
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 0.4rem;
			}
			.hit {
				background: #0f172a;
				border: 1px solid #1e293b;
				border-radius: 6px;
				padding: 0.4rem 0.6rem;
				font-size: 0.8rem;
			}
			.hit-date {
				color: #94a3b8;
				font-family: monospace;
				margin-right: 0.4rem;
			}
			.hit-snippet {
				color: #cbd5e1;
				margin: 0.15rem 0;
			}
			.hit-snippet mark {
				background: rgba(249, 115, 22, 0.3);
				color: #fdba74;
				padding: 0 0.1rem;
			}
			.hit-partition {
				color: #64748b;
				font-family: monospace;
				font-size: 0.7rem;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"preact": "https://esm.sh/preact@10.23.1",
					"preact/": "https://esm.sh/preact@10.23.1/",
					"@preact/signals": "https://esm.sh/@preact/signals@1.3.0?external=preact",
					"htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact"
				}
			}
		</script>
	</head>
	<body>
		<div id="app"></div>

		<script type="module">
			import { render } from "preact";
			import { signal, effect } from "@preact/signals";
			import { html } from "htm/preact";

			// ── The demos ─────────────────────────────────────────────────────────────────
			const TILES = [
				{
					id: "demo1",
					name: "Demo 1: Request Volume Split",
					desc: "A hash-only host. A partition splits after 5 writes. A kill crashes the partition that splits, and the migration continues by itself.",
				},
				{
					id: "demo2",
					name: "Demo 2: Multi-Tenant FTS5",
					desc: "Tenants share one hash partition. A large tenant is promoted to its own range tree, which splits by date.",
				},
				{
					id: "demo3",
					name: "Demo 3: FokosDB Topology",
					desc: "The PartitionDO topology of a real FokosDB table.",
				},
			];

			// ── State ─────────────────────────────────────────────────────────────────────
			// The URL hash (#demo1, #demo2, #demo3) names the active tile, so a shared link or a refresh opens the same tile.
			const tileFromHash = () => TILES.find((t) => `#${t.id}` === location.hash)?.id ?? TILES[0].id;
			const activeTile = signal(tileFromHash());
			window.addEventListener("hashchange", () => (activeTile.value = tileFromHash()));
			const topologyData = signal(null);
			const isLoading = signal(false);
			const isAutoPolling = signal(true);
			const logs = signal([]);
			// The tree edges that the last request used: [{ from, to }]. They light up for 1.2 seconds.
			const activeHops = signal([]);
			// Demo 2: the last search, and the partitions it visited and skipped. They stay until the next action.
			const searchForm = signal({ tenant: "acme", query: "failover", window: "all", newest: false });
			const searchResult = signal(null);

			function addLog(msg, trace = null) {
				const time = new Date().toLocaleTimeString();
				logs.value = [{ time, msg, trace }, ...logs.value.slice(0, 40)];
			}

			// ── Topology polling ──────────────────────────────────────────────────────────
			async function fetchTopology() {
				try {
					const res = await fetch(`/api/${activeTile.value}/topology`);
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					const data = await res.json();
					topologyData.value = data;
				} catch (err) {
					console.error("fetchTopology failed:", err);
				}
			}

			setInterval(() => {
				if (isAutoPolling.value) {
					fetchTopology();
				}
			}, 1500);

			// A tile change clears the highlights and reads the new topology.
			effect(() => {
				activeTile.value; // The read of the signal makes this effect run again when the tile changes.
				activeHops.value = [];
				searchResult.value = null;
				fetchTopology();
			});

			// ── Actions ───────────────────────────────────────────────────────────────────
			async function executeAction(action, payload = {}) {
				isLoading.value = true;
				searchResult.value = null;
				try {
					const res = await fetch(`/api/${activeTile.value}/${action}`, {
						method: "POST",
						headers: { "content-type": "application/json" },
						body: JSON.stringify(payload),
					});
					const json = await res.json();
					if (json.trace) {
						handleTrace(json.trace);
					}
					// A search result holds all its hits, so the log shows its counts only.
					const r = json.result;
					const logged = r?.hits
						? { hits: r.hits.length, visited: r.visited.length, skipped: r.skipped.length, stoppedEarly: r.stoppedEarly }
						: (r ?? json.error ?? {});
					addLog(`[${action}] ${json.success ? "Success" : "Failed"}: ${JSON.stringify(logged)}`, json.trace);
					await fetchTopology();
					return json;
				} catch (err) {
					addLog(`[${action}] Error: ${err.message}`);
				} finally {
					isLoading.value = false;
				}
			}

			// The DO names on the path from `node` down to `doName`, or null when `doName` is not under `node`.
			function pathTo(node, doName) {
				if (node.doName === doName) return [node.doName];
				for (const child of node.children ?? []) {
					const path = pathTo(child, doName);
					if (path) return [node.doName, ...path];
				}
				return null;
			}

			// Lights the tree edges from the root to each partition that served the request. When a search
			// goes to more than one partition, each branch lights up.
			function handleTrace(trace) {
				const roots = topologyData.value?.roots ?? [];
				const edges = new Map();
				for (const hop of trace?.servedBy ?? []) {
					const path = roots.map((r) => pathTo(r, hop.doName)).find(Boolean) ?? [];
					for (let i = 0; i + 1 < path.length; i++) edges.set(`${path[i]}->${path[i + 1]}`, { from: path[i], to: path[i + 1] });
				}
				if (edges.size === 0) return;
				activeHops.value = [...edges.values()];
				setTimeout(() => {
					activeHops.value = [];
				}, 1200);
			}

			// ── Tree layout ───────────────────────────────────────────────────────────────
			// The layout is a file tree: one row for each partition, and each child indented under its parent.
			// A deep tree grows down, not sideways.
			const INDENT = 30;
			const ROW_H = 54;
			const BOX_MIN_W = 340;
			const BOX_H = 44;
			const BOX_PAD = 10;
			const BADGE_GAP = 16;
			const PAD_X = 24;
			const PAD_Y = 24;

			// These fonts are the fonts of .node-title, .node-badge and .node-subtitle, so a box gets the width of its text.
			const measureCtx = document.createElement("canvas").getContext("2d");
			const pageFont = getComputedStyle(document.body).fontFamily;
			function textWidth(text, font) {
				measureCtx.font = `${font} ${pageFont}`;
				return Math.ceil(measureCtx.measureText(text).width);
			}

			function nodeLabels(node) {
				const isRouter = node.role === "router";
				const isSplitting = node.status === "queued" || node.status === "planned" || node.status === "cutover";
				const isImporting = node.importState === "awaiting_data" || node.importState === "importing";
				const badge = isRouter
					? "Router"
					: isSplitting
						? "Splitting"
						: isImporting
							? "Importing"
							: node.kind === "range"
								? "Range Leaf"
								: "Leaf";
				const requests = node.requestCount == null ? "" : ` · Requests: ${node.requestCount}`;
				const stats = isRouter
					? `Routing to ${node.children?.length ?? 0} targets${requests}`
					: `${node.label ? `${node.label} · ` : ""}Items: ${node.itemCount ?? 0}${requests}`;
				return { badge, stats };
			}

			// The box is wide enough for the full DO name and the badge on the first line, and for the stats line.
			function boxWidth(node) {
				const { badge, stats } = nodeLabels(node);
				const titleLine = textWidth(node.doName, "700 13px") + BADGE_GAP + textWidth(badge.toUpperCase(), "600 10px");
				return Math.max(BOX_MIN_W, BOX_PAD * 2 + Math.max(titleLine, textWidth(stats, "11px")));
			}

			function computeTreeLayout(roots) {
				if (!roots || roots.length === 0) return { nodes: [], links: [], width: 720, height: 200 };

				const nodes = [];
				const links = [];
				let row = 0;
				let right = 0;

				function layoutSubtree(node, depth) {
					const pos = { node, x: PAD_X + depth * INDENT, y: PAD_Y + row * ROW_H + ROW_H / 2, w: boxWidth(node) };
					right = Math.max(right, pos.x + pos.w);
					row += 1;
					nodes.push(pos);

					for (const child of node.children ?? []) {
						const cp = layoutSubtree(child, depth + 1);
						links.push({
							from: node,
							to: child,
							fromPos: pos,
							toPos: cp,
							id: `${node.doName}->${child.doName}`,
						});
					}

					return pos;
				}

				for (const r of roots) {
					layoutSubtree(r, 0);
				}

				const width = Math.max(720, right + PAD_X);
				const height = PAD_Y * 2 + row * ROW_H;
				return { nodes, links, width, height };
			}

			// ── Component: topology view ──────────────────────────────────────────────────
			function TopologyView({ topology }) {
				const roots = topology?.roots ?? [];
				const { nodes, links, width: svgWidth, height: svgHeight } = computeTreeLayout(roots);
				const boxHeight = BOX_H;

				function onNodeClick(node) {
					if (node.role === "router" && node.children?.length > 0) {
						// A click on a router lights the edge to one of its children.
						const randomChild = node.children[Math.floor(Math.random() * node.children.length)];
						activeHops.value = [{ from: node.doName, to: randomChild.doName }];
						setTimeout(() => {
							activeHops.value = [];
						}, 1200);
					}
				}

				return html`
					<div class="topology-container">
						<div class="topology-toolbar">
							<span>
								<strong>${topology?.tile?.toUpperCase() ?? "SHARD GROUP"}</strong>
								${topology?.summary
									? ` — ${topology.summary.totalPartitions} partitions (${topology.summary.routerCount} routers, ${topology.summary.leafCount} leaves)`
									: ""}
							</span>
							<div>
								<label style="display:inline-flex; align-items:center; gap:0.4rem; margin:0; cursor:pointer;">
									<input type="checkbox" checked=${isAutoPolling.value} onChange=${(e) => (isAutoPolling.value = e.target.checked)} />
									Auto-refresh (1.5s)
								</label>
							</div>
						</div>

						<div class="topology-scroll">
							<svg class="topology-svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width=${svgWidth} height=${svgHeight}>
								<!-- Each edge goes down from the bottom edge of the parent, then right into the child. -->
								${links.map((link) => {
									const vx = link.fromPos.x + 14;
									const sy = link.fromPos.y + boxHeight / 2;
									const ty = link.toPos.y;
									const tx = link.toPos.x;
									const d = `M ${vx} ${sy} V ${ty} H ${tx}`;

									const isHopActive = activeHops.value.some((h) => h.from === link.from.doName && h.to === link.to.doName);

									return html`
										<g key=${link.id}>
											<path d=${d} class="tree-link ${isHopActive ? "link-active" : ""}" />
											${isHopActive &&
											html`
												<circle r="5" class="link-pulse-dot">
													<animateMotion path=${d} dur="0.8s" repeatCount="1" />
												</circle>
											`}
										</g>
									`;
								})}

								<!-- Partition boxes -->
								${nodes.map((pos) => {
									const node = pos.node;
									const isRouter = node.role === "router";
									const isTarget = activeHops.value.some((h) => h.to === node.doName);
									const isVisited = searchResult.value?.visited.includes(node.doName);
									const isSkipped = searchResult.value?.skipped.includes(node.doName);
									const { badge, stats } = nodeLabels(node);

									return html`
										<g
											key=${node.id}
											class="node-group ${isRouter ? "is-router" : ""} ${isTarget ? "is-active-target" : ""} ${isVisited
												? "is-visited"
												: ""} ${isSkipped ? "is-skipped" : ""}"
											transform="translate(${pos.x}, ${pos.y - boxHeight / 2})"
											onClick=${() => onNodeClick(node)}
										>
											<rect width=${pos.w} height=${boxHeight} class="node-rect" />
											<text x=${BOX_PAD} y="18" class="node-title">${node.doName}</text>
											<text x=${pos.w - BOX_PAD} y="18" text-anchor="end" class="node-badge">${badge}</text>
											<text x=${BOX_PAD} y="35" class="node-subtitle">${stats}</text>
										</g>
									`;
								})}
							</svg>
						</div>
					</div>
				`;
			}

			// ── Component: Demo 2 full-text search ────────────────────────────────────────
			const EXAMPLE_QUERIES = ["failover", "data*", "failover OR outage", "database NOT cache", '"replication lag"', "invoice"];
			const daysAgo = (n) => new Date(Date.now() - n * 86_400_000).toISOString().slice(0, 10);
			// A date window is the sort-key interval [from, to): every sort key starts with the document date.
			const DATE_WINDOWS = [
				{ id: "all", label: "All time", from: null, to: null },
				{ id: "2025", label: "2025", from: "2025-01-01", to: "2026-01-01" },
				{ id: "2026h1", label: "2026 H1", from: "2026-01-01", to: "2026-07-01" },
				{ id: "90d", label: "Last 90 days", from: daysAgo(90), to: null },
			];

			async function runSearch() {
				const f = searchForm.value;
				const w = DATE_WINDOWS.find((d) => d.id === f.window);
				const json = await executeAction("search", {
					tenant: f.tenant,
					query: f.query,
					from: w.from,
					to: w.to,
					limit: f.newest ? 5 : undefined,
				});
				searchResult.value = json?.success ? json.result : null;
			}

			// An FTS5 snippet has U+E000 before each match and U+E001 after it. Each match becomes a <mark>.
			function renderSnippet(snippet) {
				return snippet
					.split(/(\uE000[^\uE001]*\uE001)/)
					.map((part) => (part.startsWith("\uE000") ? html`<mark>${part.slice(1, -1)}</mark>` : part));
			}

			function SearchBar() {
				const f = searchForm.value;
				const set = (patch) => (searchForm.value = { ...f, ...patch });
				return html`
					<form
						class="search-form"
						onSubmit=${(e) => {
							e.preventDefault();
							runSearch();
						}}
					>
						<div class="search-row">
							<select value=${f.tenant} onChange=${(e) => set({ tenant: e.target.value })}>
								<option value="acme">acme</option>
								<option value="beta">beta</option>
							</select>
							<input type="search" value=${f.query} placeholder="FTS5 query" onInput=${(e) => set({ query: e.target.value })} />
							<div class="chip-row">
								${DATE_WINDOWS.map(
									(w) =>
										html`<button type="button" class=${f.window === w.id ? "" : "secondary outline"} onClick=${() => set({ window: w.id })}>
											${w.label}
										</button>`,
								)}
							</div>
							<label
								><input type="checkbox" role="switch" checked=${f.newest} onChange=${(e) => set({ newest: e.target.checked })} /> Newest 5
								only</label
							>
							<button type="submit" disabled=${isLoading.value}>🔍 Search ${f.tenant}</button>
						</div>
						<div class="search-row">
							<span class="search-row-label">Try:</span>
							<div class="chip-row">
								${EXAMPLE_QUERIES.map(
									(q) =>
										html`<button type="button" class=${f.query === q ? "" : "outline"} onClick=${() => set({ query: q })}>${q}</button>`,
								)}
							</div>
						</div>
					</form>
				`;
			}

			function SearchResults() {
				const r = searchResult.value;
				if (!r) return null;
				const total = r.visited.length + r.skipped.length;
				return html`
					<div class="search-summary">
						${r.hits.length} hits · visited ${r.visited.length} of ${total} ${r.tenant}
						partitions${r.stoppedEarly ? " · stopped early" : ""}
					</div>
					<div class="hit-list">
						${r.hits.map(
							(hit) => html`
								<div class="hit">
									<div><span class="hit-date">${hit.sortKey.slice(0, 10)}</span><strong>${hit.title}</strong></div>
									<div class="hit-snippet">${renderSnippet(hit.snippet)}</div>
									<div class="hit-partition">${hit.partition} · bm25 ${hit.score.toFixed(2)}</div>
								</div>
							`,
						)}
					</div>
				`;
			}

			// ── Component: control panel ──────────────────────────────────────────────────
			function ControlPanel({ tile, data }) {
				const id = tile.id;
				const summary = data?.summary;

				return html`
					<div class="control-card">
						<h3>${tile.name}</h3>
						<p>${tile.desc}</p>

						<div class="stats-grid">
							<div class="stat-item">
								<small>Partitions</small>
								<strong>${summary?.totalPartitions ?? 1}</strong>
							</div>
							<div class="stat-item">
								<small>Routers / Splits</small>
								<strong>${summary?.routerCount ?? 0}</strong>
							</div>
							<div class="stat-item">
								<small>Leaves</small>
								<strong>${summary?.leafCount ?? 1}</strong>
							</div>
							<div class="stat-item">
								<small>State</small>
								<strong>${summary?.routerCount ? "Split / Routed" : "Single Root"}</strong>
							</div>
						</div>

						${id === "demo1" &&
						html`
							<div class="stats-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 0.75rem;">
								<div class="stat-item" style="border-left: 3px solid #f97316;">
									<small>Writes Acknowledged</small>
									<strong>${data?.reconciliation?.acknowledgedWrites ?? 0}</strong>
								</div>
								<div class="stat-item" style="border-left: 3px solid #22c55e;">
									<small>Writes in Partitions</small>
									<strong>${data?.reconciliation?.presentWrites ?? 0}</strong>
								</div>
							</div>
							<div style="background: #0f172a; padding: 0.4rem 0.6rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.8rem;">
								<span style="display: block; color: var(--pico-muted-color);">Reconciliation</span>
								<strong style="display: block; color: ${data?.reconciliation?.reconciled ? "#22c55e" : "#f59e0b"}">
									${data?.reconciliation?.reconciled
										? "✓ Reconciled (Zero Lost / Dupes)"
										: `Reconciling (${data?.reconciliation?.presentWrites ?? 0} / ${data?.reconciliation?.acknowledgedWrites ?? 0})...`}
								</strong>
							</div>

							<div class="btn-row">
								<button class="primary" disabled=${isLoading.value} onClick=${() => executeAction("increment")}>
									⚡ Increment (+1 write)
								</button>
								<button disabled=${isLoading.value} onClick=${() => executeAction("batch-increment", { count: 5 })}>
									🚀 Volume Burst (+5 writes to trigger split)
								</button>
								<button
									class="outline"
									style="border-color:#ef4444; color:#ef4444;"
									disabled=${isLoading.value}
									onClick=${() => executeAction("kill")}
								>
									⚠️ Kill Splitting Partition (ctx.abort)
								</button>
								<button class="outline" disabled=${isLoading.value} onClick=${() => executeAction("reset")}>↺ Reset Demo 1</button>
							</div>
							<small style="color:var(--pico-muted-color); font-size:0.75rem; display:block;">
								Kill crashes the partition that splits now. Its children pull the next page, and the pull starts it again from storage. The
								reconciliation above shows that no write is lost.
							</small>
						`}
						${id === "demo2" &&
						html`
							<div class="btn-row">
								<button
									class="primary"
									disabled=${isLoading.value}
									onClick=${() => executeAction("add-docs", { tenant: "acme", count: 5 })}
								>
									📄 Ingest 5 Acme Docs (Hot Tenant)
								</button>
								<button disabled=${isLoading.value} onClick=${() => executeAction("add-docs", { tenant: "beta", count: 1 })}>
									📄 Ingest 1 Beta Doc (Small Tenant)
								</button>
								<button class="outline" disabled=${isLoading.value} onClick=${() => executeAction("reset")}>↺ Reset Demo 2</button>
							</div>
							<small style="color:var(--pico-muted-color); font-size:0.75rem; display:block;">
								A tenant with 5 documents moves from the shared partition to a range tree of its own. A range partition with 8 documents
								splits by document date. A date window is a sort-key range, so a search visits only the partitions of that window.
							</small>
						`}
						${id === "demo3" &&
						html`
							<div class="btn-row">
								<button
									class="primary"
									disabled=${isLoading.value}
									onClick=${() =>
										executeAction("put-item", { hashKey: `user#${Math.floor(Math.random() * 30)}`, sortKey: "profile", data: "live demo" })}
								>
									💾 FokosDB putItem
								</button>
								<button disabled=${isLoading.value} onClick=${() => executeAction("get-item", { hashKey: "user#1", sortKey: "profile" })}>
									🔎 FokosDB getItem
								</button>
								<button class="secondary" disabled=${isLoading.value} onClick=${() => executeAction("seed", { count: 8 })}>
									🌱 Pre-seed Shard Group
								</button>
								<button class="outline" disabled=${isLoading.value} onClick=${() => executeAction("reset")}>↺ Reset FokosDB Table</button>
							</div>
						`}

						<!-- Activity log -->
						<div style="margin-top: 1rem;">
							<small style="color:var(--pico-muted-color); font-weight:600;">ACTIVITY LOG & ROUTING EVIDENCE</small>
							<div class="log-console">
								${logs.value.length === 0
									? html`<div style="color:#64748b">No activity yet. Click an action above.</div>`
									: logs.value.map(
											(l, i) => html`
												<div key=${i} class="log-entry">
													<span class="log-time">[${l.time}]</span>
													<span>${l.msg}</span>
													${l.trace &&
													html`
														<div class="log-trace">
															↳ Hops: ${l.trace.forwardCount} (${l.trace.servedBy.map((s) => s.doName).join(" → ")})
														</div>
													`}
												</div>
											`,
										)}
							</div>
						</div>
					</div>
				`;
			}

			// ── Component: app ────────────────────────────────────────────────────────────
			function App() {
				const currentTile = TILES.find((t) => t.id === activeTile.value) ?? TILES[0];

				return html`
					<div class="app-shell">
						<header class="demo-header">
							<div>
								<h2 style="margin: 0; font-size: 1.4rem;">FokosShardingRuntime</h2>
								<small style="color: var(--pico-muted-color);"> Multi-Tenant Sharding, Request-Volume Splits, and Promotion </small>
							</div>
							<div class="tile-nav">
								${TILES.map(
									(t) => html`
										<button key=${t.id} class=${activeTile.value === t.id ? "active" : "outline"} onClick=${() => (location.hash = t.id)}>
											${t.name.split(":")[0]}
										</button>
									`,
								)}
							</div>
						</header>

						${activeTile.value === "demo2" &&
						html`
							<section class="search-card">
								<${SearchBar} />
								<${SearchResults} />
							</section>
						`}

						<main class="layout-grid">
							<${TopologyView} topology=${topologyData.value} />

							<${ControlPanel} tile=${currentTile} data=${topologyData.value} />
						</main>
					</div>
				`;
			}

			render(html`<${App} />`, document.getElementById("app"));
		</script>
	</body>
</html>
