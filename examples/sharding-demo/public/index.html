<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FokosShardingRuntime — Demo Suite</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.orange.min.css" />
		<style>
			:root {
				--font-family: system-ui, -apple-system, sans-serif;
			}
			body {
				padding: 1.5rem;
				max-width: 1400px;
				margin: 0 auto;
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
			}
			#app,
			.app-shell {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}
			header.demo-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				border-bottom: 1px solid var(--pico-muted-border-color);
				padding-bottom: 1rem;
				margin-bottom: 1.5rem;
			}
			.tile-nav {
				display: flex;
				gap: 0.5rem;
			}
			.tile-nav button {
				padding: 0.4rem 0.9rem;
				font-size: 0.85rem;
				margin: 0;
			}
			.tile-nav button.active {
				background: var(--pico-primary);
				color: var(--pico-primary-inverse);
			}
			.layout-grid {
				display: grid;
				grid-template-columns: 1fr 380px;
				gap: 1.5rem;
				align-items: stretch;
				flex: 1;
				min-height: 0;
			}
			@media (max-width: 1024px) {
				.layout-grid {
					grid-template-columns: 1fr;
					flex: none;
				}
				.topology-scroll {
					max-height: 70vh;
				}
			}
			.topology-container {
				background: var(--pico-card-background-color);
				border: 1px solid var(--pico-muted-border-color);
				border-radius: var(--pico-border-radius);
				padding: 1rem;
				position: relative;
				min-height: 320px;
				display: flex;
				flex-direction: column;
			}
			.topology-scroll {
				flex: 1;
				min-height: 0;
				overflow: auto;
			}
			.topology-toolbar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 0.75rem;
				font-size: 0.8rem;
				color: var(--pico-muted-color);
			}
			.topology-svg {
				display: block;
			}
			/* Box styles */
			.node-group {
				cursor: pointer;
				transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			}
			.node-rect {
				fill: #1e293b;
				stroke: #475569;
				stroke-width: 2;
				rx: 8;
				ry: 8;
				transition: all 0.3s ease;
			}
			.node-group:hover .node-rect {
				stroke: var(--pico-primary);
				filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.3));
			}
			.node-group.is-router .node-rect {
				fill: #111827;
				stroke: #ea580c;
				stroke-dasharray: 4 2;
			}
			.node-group.is-active-target .node-rect {
				stroke: #22c55e;
				filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.5));
			}
			.node-title {
				font-size: 13px;
				font-weight: 700;
				fill: #f8fafc;
			}
			.node-badge {
				font-size: 10px;
				font-weight: 600;
				fill: #ea580c;
				text-transform: uppercase;
			}
			.node-subtitle {
				font-size: 11px;
				fill: #94a3b8;
			}
			/* Connection links */
			.tree-link {
				fill: none;
				stroke: #334155;
				stroke-width: 2;
				transition: stroke 0.3s ease;
			}
			.tree-link.link-active {
				stroke: var(--pico-primary);
				stroke-width: 3.5;
				filter: drop-shadow(0 0 6px var(--pico-primary));
			}
			.link-pulse-dot {
				fill: #f97316;
				filter: drop-shadow(0 0 6px #f97316);
			}
			/* Controls and sidebar */
			.control-card {
				background: var(--pico-card-background-color);
				border: 1px solid var(--pico-muted-border-color);
				border-radius: var(--pico-border-radius);
				padding: 1.25rem;
			}
			.control-card h3 {
				font-size: 1.1rem;
				margin-bottom: 0.5rem;
			}
			.control-card p {
				font-size: 0.85rem;
				color: var(--pico-muted-color);
				margin-bottom: 1rem;
			}
			.btn-row {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				margin-bottom: 1rem;
			}
			.btn-row button {
				width: 100%;
				margin: 0;
				padding: 0.5rem 0.8rem;
				font-size: 0.85rem;
			}
			.stats-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 0.5rem;
				margin-bottom: 1rem;
			}
			.stat-item {
				background: #0f172a;
				border: 1px solid #1e293b;
				border-radius: 6px;
				padding: 0.5rem 0.75rem;
			}
			.stat-item small {
				color: #94a3b8;
				font-size: 0.7rem;
				display: block;
			}
			.stat-item strong {
				font-size: 1.1rem;
				color: #f8fafc;
			}
			.log-console {
				background: #020617;
				border: 1px solid #1e293b;
				border-radius: 6px;
				padding: 0.6rem;
				font-family: monospace;
				font-size: 0.75rem;
				max-height: 180px;
				overflow-y: auto;
				color: #cbd5e1;
			}
			.log-entry {
				padding: 0.2rem 0;
				border-bottom: 1px solid #0f172a;
			}
			.log-entry:last-child {
				border-bottom: none;
			}
			.log-time {
				color: #64748b;
				margin-right: 0.4rem;
			}
			.log-trace {
				color: #f97316;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"preact": "https://esm.sh/preact@10.23.1",
					"preact/": "https://esm.sh/preact@10.23.1/",
					"@preact/signals": "https://esm.sh/@preact/signals@1.3.0?external=preact",
					"htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact"
				}
			}
		</script>
	</head>
	<body>
		<div id="app"></div>

		<script type="module">
			import { h, render } from "preact";
			import { signal, computed, effect } from "@preact/signals";
			import { html } from "htm/preact";

			// ── Demos definition ──────────────────────────────────────────────────────────
			const TILES = [
				{
					id: "demo1",
					name: "Demo 1: Request Volume Split",
					desc: "Hash-only partition host. Splits on request volume threshold. Can kill the splitting partition, and the migration resumes by itself.",
				},
				{
					id: "demo2",
					name: "Demo 2: Multi-Tenant FTS5",
					desc: "Tenants start co-located on shared hash partitions. Hot tenants promote into dedicated range partitions.",
				},
				{
					id: "demo3",
					name: "Demo 3: FokosDB Topology",
					desc: "Production PartitionDO topology with real 2PC range and hash trees.",
				},
			];

			// ── Global Signals ────────────────────────────────────────────────────────────
			const activeTile = signal("demo1");
			const topologyData = signal(null);
			const isLoading = signal(false);
			const isAutoPolling = signal(true);
			const logs = signal([]);
			const activeHops = signal([]); // [{ from, to }]
			const animatedPackets = signal([]); // [{ id, fromX, fromY, toX, toY, progress }]

			function addLog(msg, trace = null) {
				const time = new Date().toLocaleTimeString();
				logs.value = [{ time, msg, trace }, ...logs.value.slice(0, 40)];
			}

			// ── Topology Polling ──────────────────────────────────────────────────────────
			async function fetchTopology() {
				try {
					const res = await fetch(`/api/topology/${activeTile.value}`);
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					const data = await res.json();
					topologyData.value = data;
				} catch (err) {
					console.error("fetchTopology failed:", err);
				}
			}

			// Poll periodically
			setInterval(() => {
				if (isAutoPolling.value) {
					fetchTopology();
				}
			}, 1500);

			effect(() => {
				// Re-fetch when tile changes
				const current = activeTile.value;
				activeHops.value = [];
				fetchTopology();
			});

			// ── Execute Action Helper ─────────────────────────────────────────────────────
			async function executeAction(action, payload = {}) {
				isLoading.value = true;
				try {
					const res = await fetch(`/api/action/${activeTile.value}/${action}`, {
						method: "POST",
						headers: { "content-type": "application/json" },
						body: JSON.stringify(payload),
					});
					const json = await res.json();
					if (json.trace) {
						handleTrace(json.trace);
					}
					addLog(
						`[${action}] ${json.success ? "Success" : "Failed"}: ${JSON.stringify(json.result || json.error || json.stats || json.item || {})}`,
						json.trace,
					);
					await fetchTopology();
					return json;
				} catch (err) {
					addLog(`[${action}] Error: ${err.message}`);
				} finally {
					isLoading.value = false;
				}
			}

			function handleTrace(trace) {
				if (!trace || !trace.servedBy || trace.servedBy.length <= 1) return;
				const hops = [];
				for (let i = 0; i < trace.servedBy.length - 1; i++) {
					hops.push({
						from: trace.servedBy[i].doName,
						to: trace.servedBy[i + 1].doName,
					});
				}
				activeHops.value = hops;
				setTimeout(() => {
					activeHops.value = [];
				}, 1200);
			}

			// ── Tree Layout Calculation ───────────────────────────────────────────────────
			// File-tree layout: one row per partition, children indented under their parent.
			// Depth costs only a small indent, so wide trees grow down instead of sideways.
			const INDENT = 30;
			const ROW_H = 54;
			const BOX_W = 340;
			const BOX_H = 44;
			const PAD_X = 24;
			const PAD_Y = 24;

			function computeTreeLayout(roots) {
				if (!roots || roots.length === 0) return { nodes: [], links: [], width: 720, height: 200 };

				const nodes = [];
				const links = [];
				let row = 0;
				let maxDepth = 0;

				function layoutSubtree(node, depth) {
					maxDepth = Math.max(maxDepth, depth);
					const pos = { node, x: PAD_X + depth * INDENT, y: PAD_Y + row * ROW_H + ROW_H / 2, depth };
					row += 1;
					nodes.push(pos);

					for (const child of node.children ?? []) {
						const cp = layoutSubtree(child, depth + 1);
						links.push({
							from: node,
							to: child,
							fromPos: pos,
							toPos: cp,
							id: `${node.doName}->${child.doName}`,
						});
					}

					return pos;
				}

				for (const r of roots) {
					layoutSubtree(r, 0);
				}

				const width = Math.max(720, PAD_X * 2 + maxDepth * INDENT + BOX_W + 40);
				const height = PAD_Y * 2 + row * ROW_H;
				return { nodes, links, width, height };
			}

			// ── Component: Box-Tree Topology View ──────────────────────────────────────────
			function TopologyView({ topology }) {
				const roots = topology?.roots ?? [];
				const { nodes, links, width: svgWidth, height: svgHeight } = computeTreeLayout(roots);
				const boxWidth = BOX_W;
				const boxHeight = BOX_H;

				function onNodeClick(node) {
					if (node.role === "router" && node.children?.length > 0) {
						// Animate forward from router to a child
						const randomChild = node.children[Math.floor(Math.random() * node.children.length)];
						activeHops.value = [{ from: node.doName, to: randomChild.doName }];
						setTimeout(() => {
							activeHops.value = [];
						}, 1200);
					}
				}

				return html`
					<div class="topology-container">
						<div class="topology-toolbar">
							<span>
								<strong>${topology?.tile?.toUpperCase() ?? "SHARD GROUP"}</strong>
								${topology?.summary
									? ` — ${topology.summary.totalPartitions} partitions (${topology.summary.routerCount} routers, ${topology.summary.leafCount} leaves)`
									: ""}
							</span>
							<div>
								<label style="display:inline-flex; align-items:center; gap:0.4rem; margin:0; cursor:pointer;">
									<input type="checkbox" checked=${isAutoPolling.value} onChange=${(e) => (isAutoPolling.value = e.target.checked)} />
									Auto-refresh (1.5s)
								</label>
							</div>
						</div>

						<div class="topology-scroll">
							<svg class="topology-svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width=${svgWidth} height=${svgHeight}>
								<defs>
									<linearGradient id="linkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
										<stop offset="0%" stop-color="#ea580c" />
										<stop offset="100%" stop-color="#f97316" />
									</linearGradient>
								</defs>

								<!-- Connecting Lines: a shared vertical trunk out of the parent's
							     bottom edge, then a stub into the child's left edge. -->
								${links.map((link) => {
									const vx = link.fromPos.x + 14;
									const sy = link.fromPos.y + boxHeight / 2;
									const ty = link.toPos.y;
									const tx = link.toPos.x;
									const d = `M ${vx} ${sy} V ${ty} H ${tx}`;

									const isHopActive = activeHops.value.some((h) => h.from === link.from.doName && h.to === link.to.doName);

									return html`
										<g key=${link.id}>
											<path d=${d} class="tree-link ${isHopActive ? "link-active" : ""}" />
											${isHopActive &&
											html`
												<circle r="5" class="link-pulse-dot">
													<animateMotion path=${d} dur="0.8s" repeatCount="1" />
												</circle>
											`}
										</g>
									`;
								})}

								<!-- Partition Boxes -->
								${nodes.map((pos) => {
									const node = pos.node;
									const isRouter = node.role === "router";
									const isTarget = activeHops.value.some((h) => h.to === node.doName);

									const isSplitting = node.status === "queued" || node.status === "planned" || node.status === "cutover";
									const isImporting = node.importState === "awaiting_data" || node.importState === "importing";
									const badgeText = isRouter
										? "Router"
										: isSplitting
											? "Splitting"
											: isImporting
												? "Importing"
												: node.kind === "range"
													? "Range Leaf"
													: "Leaf";
									const statsLine = isRouter
										? `Routing to ${node.children?.length ?? 0} targets · Requests: ${node.requestCount ?? 0}`
										: `${node.hashKey ? `Key: ${node.hashKey} · ` : ""}Items: ${node.itemCount ?? 0} · Requests: ${node.requestCount ?? 0}`;

									return html`
										<g
											key=${node.id}
											class="node-group ${isRouter ? "is-router" : ""} ${isTarget ? "is-active-target" : ""}"
											transform="translate(${pos.x}, ${pos.y - boxHeight / 2})"
											onClick=${() => onNodeClick(node)}
										>
											<rect width=${boxWidth} height=${boxHeight} class="node-rect" />
											<!-- Header / Title -->
											<text x="10" y="18" class="node-title">
												${node.doName.length > 28 ? node.doName.slice(0, 28) + "…" : node.doName}
											</text>
											<!-- Badge, far right of the title line -->
											<text x=${boxWidth - 10} y="18" text-anchor="end" class="node-badge">${badgeText}</text>
											<!-- Subtitle / Stats -->
											<text x="10" y="35" class="node-subtitle">${statsLine}</text>
										</g>
									`;
								})}
							</svg>
						</div>
					</div>
				`;
			}

			// ── Component: Control Panel Shell ────────────────────────────────────────────
			function ControlPanel({ tile, data }) {
				const id = tile.id;
				const summary = data?.summary;

				return html`
					<div class="control-card">
						<h3>${tile.name}</h3>
						<p>${tile.desc}</p>

						<div class="stats-grid">
							<div class="stat-item">
								<small>Partitions</small>
								<strong>${summary?.totalPartitions ?? 1}</strong>
							</div>
							<div class="stat-item">
								<small>Routers / Splits</small>
								<strong>${summary?.routerCount ?? 0}</strong>
							</div>
							<div class="stat-item">
								<small>Leaves</small>
								<strong>${summary?.leafCount ?? 1}</strong>
							</div>
							<div class="stat-item">
								<small>State</small>
								<strong>${summary?.routerCount ? "Split / Routed" : "Single Root"}</strong>
							</div>
						</div>

						${id === "demo1" &&
						html`
							<div class="stats-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 0.75rem;">
								<div class="stat-item" style="border-left: 3px solid #f97316;">
									<small>Writes Acknowledged</small>
									<strong>${data?.reconciliation?.acknowledgedWrites ?? 0}</strong>
								</div>
								<div class="stat-item" style="border-left: 3px solid #22c55e;">
									<small>Writes in Partitions</small>
									<strong>${data?.reconciliation?.presentWrites ?? 0}</strong>
								</div>
							</div>
							<div style="background: #0f172a; padding: 0.4rem 0.6rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.8rem;">
								<span style="display: block; color: var(--pico-muted-color);">Reconciliation</span>
								<strong style="display: block; color: ${data?.reconciliation?.reconciled ? "#22c55e" : "#f59e0b"}">
									${data?.reconciliation?.reconciled
										? "✓ Reconciled (Zero Lost / Dupes)"
										: `Reconciling (${data?.reconciliation?.presentWrites ?? 0} / ${data?.reconciliation?.acknowledgedWrites ?? 0})...`}
								</strong>
							</div>

							<div class="btn-row">
								<button
									class="primary"
									disabled=${isLoading.value}
									onClick=${() => executeAction("increment", { key: `k-${Math.floor(Math.random() * 8)}` })}
								>
									⚡ Increment (+1 write)
								</button>
								<button disabled=${isLoading.value} onClick=${() => executeAction("batch-increment", { count: 5 })}>
									🚀 Volume Burst (+5 writes to trigger split)
								</button>
								<button
									class="outline"
									style="border-color:#ef4444; color:#ef4444;"
									disabled=${isLoading.value}
									onClick=${() => executeAction("kill")}
								>
									⚠️ Kill Splitting Partition (ctx.abort)
								</button>
								<button class="outline" disabled=${isLoading.value} onClick=${() => executeAction("reset")}>↺ Reset Demo 1</button>
							</div>
							<small style="color:var(--pico-muted-color); font-size:0.75rem; display:block;">
								Kill crashes the partition that is splitting now. Its children pull the next page, which starts it again from storage.
								Reconciliation above shows that no write was lost.
							</small>
						`}
						${id === "demo2" &&
						html`
							<div class="btn-row">
								<button
									class="primary"
									disabled=${isLoading.value}
									onClick=${() =>
										executeAction("add-doc", { tenantId: "acme", title: "Quarterly Report", body: "financial metrics database sharding" })}
								>
									📄 Ingest Acme Doc (Hot Tenant)
								</button>
								<button
									disabled=${isLoading.value}
									onClick=${() =>
										executeAction("add-doc", { tenantId: "beta", title: "Team Notes", body: "weekly sync engineering topics" })}
								>
									📄 Ingest Beta Doc (Shared Tenant)
								</button>
								<button class="secondary" disabled=${isLoading.value} onClick=${() => executeAction("promote", { tenantId: "acme" })}>
									⭐ Promote Tenant Acme (Range Root)
								</button>
								<button disabled=${isLoading.value} onClick=${() => executeAction("search", { tenantId: "acme", query: "database" })}>
									🔍 Scoped Search (Acme: "database")
								</button>
								<button class="outline" disabled=${isLoading.value} onClick=${() => executeAction("reset")}>↺ Reset Demo 2</button>
							</div>
						`}
						${id === "demo3" &&
						html`
							<div class="btn-row">
								<button
									class="primary"
									disabled=${isLoading.value}
									onClick=${() =>
										executeAction("put-item", { hashKey: `user#${Math.floor(Math.random() * 30)}`, sortKey: "profile", data: "live demo" })}
								>
									💾 FokosDB putItem (2PC Write)
								</button>
								<button disabled=${isLoading.value} onClick=${() => executeAction("get-item", { hashKey: "user#1", sortKey: "profile" })}>
									🔎 FokosDB getItem
								</button>
								<button class="secondary" disabled=${isLoading.value} onClick=${() => executeAction("seed", { count: 8 })}>
									🌱 Pre-seed Shard Group
								</button>
								<button class="outline" disabled=${isLoading.value} onClick=${() => executeAction("reset")}>↺ Reset FokosDB Table</button>
							</div>
						`}

						<!-- Log stream -->
						<div style="margin-top: 1rem;">
							<small style="color:var(--pico-muted-color); font-weight:600;">ACTIVITY LOG & ROUTING EVIDENCE</small>
							<div class="log-console">
								${logs.value.length === 0
									? html`<div style="color:#64748b">No activity yet. Click an action above.</div>`
									: logs.value.map(
											(l, i) => html`
												<div key=${i} class="log-entry">
													<span class="log-time">[${l.time}]</span>
													<span>${l.msg}</span>
													${l.trace &&
													html`
														<div class="log-trace">
															↳ Hops: ${l.trace.forwardCount} (${l.trace.servedBy.map((s) => s.doName).join(" → ")})
														</div>
													`}
												</div>
											`,
										)}
							</div>
						</div>
					</div>
				`;
			}

			// ── Main App Component ────────────────────────────────────────────────────────
			function App() {
				const currentTile = TILES.find((t) => t.id === activeTile.value) ?? TILES[0];

				return html`
					<div class="app-shell">
						<header class="demo-header">
							<div>
								<h2 style="margin: 0; font-size: 1.4rem;">FokosShardingRuntime</h2>
								<small style="color: var(--pico-muted-color);"> Multi-Tenant Sharding, Request-Volume Splits, and Promotion </small>
							</div>
							<div class="tile-nav">
								${TILES.map(
									(t) => html`
										<button
											key=${t.id}
											class=${activeTile.value === t.id ? "active" : "outline"}
											onClick=${() => (activeTile.value = t.id)}
										>
											${t.name.split(":")[0]}
										</button>
									`,
								)}
							</div>
						</header>

						<main class="layout-grid">
							<!-- Left Column: Shared Topology View -->
							<${TopologyView} topology=${topologyData.value} />

							<!-- Right Column: Control Panel Shell -->
							<${ControlPanel} tile=${currentTile} data=${topologyData.value} />
						</main>
					</div>
				`;
			}

			render(html`<${App} />`, document.getElementById("app"));
		</script>
	</body>
</html>
