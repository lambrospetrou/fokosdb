packages:
  - "packages/*"
  - "examples/*"

# Native dependencies whose install scripts must run: workerd and esbuild unpack the platform
# binaries the Workers runtime and its bundler need, and hurl fetches its release archive.
allowBuilds:
  "@orangeopensource/hurl": true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.2.7"
  - miniflare@5.20260923.0-alpha
  - wrangler@4.140.0
